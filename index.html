<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E3A42">
<title>Fly The Ocean · Efoil Fuerte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Figtree:wght@500;700&display=swap">
<style>
:root{--sky:#7FD3F0;--sea:#1F8A8F;--deep:#0E3A42;--sun:#F4C15D;--coral:#F26B4E;--ink:#1A1A1A;--paper:#FFF8E7}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--deep);font-family:"Figtree",Arial,sans-serif;color:var(--ink);position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(rgba(255,255,255,.08) 1.5px,transparent 2px);background-size:14px 14px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;width:100vw;height:100vh;height:100dvh;touch-action:none}
@media (min-aspect-ratio:1/1){
  .stage{width:min(100vw,calc(100dvh * 1.8));height:min(100dvh,calc(100vw / 1.8))}
}
canvas{width:100%;height:100%;display:block;background:var(--sky)}
@media (min-aspect-ratio:1/1) and (min-width:700px){canvas{border:5px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--ink)}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.overlay[hidden]{display:none}
.bubble{background:var(--paper);border:5px solid var(--ink);border-radius:26px;padding:20px 22px 22px;width:min(92vw,440px);text-align:center;box-shadow:8px 8px 0 var(--ink);position:relative;transform:rotate(-1.5deg)}
.bubble::after{content:"";position:absolute;left:56px;bottom:-26px;border:14px solid transparent;border-top-color:var(--ink);border-left-color:var(--ink);transform:skewX(20deg)}
.bubble h1{font-family:"Bangers",Impact,sans-serif;font-size:clamp(36px,10vw,60px);margin:0;letter-spacing:.04em;color:var(--coral);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);line-height:1}
.bubble h2{font-family:"Bangers",Impact,sans-serif;font-size:clamp(30px,9vw,44px);margin:0;letter-spacing:.04em;color:var(--sea);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.bubble p{margin:10px 0 0;font-size:15px;font-weight:500;line-height:1.35}
.bubble .big{font-family:"Bangers",Impact,sans-serif;font-size:46px;color:var(--ink);margin-top:6px;line-height:1}
.bubble .tiny{font-size:12px;color:#5C5C5C;margin-top:12px}
.bubble .tiny b{font-family:"Bangers",Impact,sans-serif;letter-spacing:.06em;color:var(--sea);font-size:14px}
.btn{margin-top:16px;display:inline-block;font-family:"Bangers",Impact,sans-serif;font-size:26px;letter-spacing:.06em;background:var(--sun);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:12px 30px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transform:rotate(1.5deg);transition:transform .1s;touch-action:manipulation}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:2px}
.kbd{display:inline-block;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;background:#fff;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.hint{display:none}
@media (hover:none){.hint.touch{display:inline}}
@media (hover:hover){.hint.mouse{display:inline}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Efoil game canvas"></canvas>
  <div class="overlay" id="start">
    <div class="bubble">
      <h1>FLY THE OCEAN!</h1>
      <p><b>Hold</b> to lift the foil, <b>let go</b> to sink. Dodge buoys and gulls, grab batteries before yours runs flat.</p>
      <p><span class="hint touch">Touch and hold anywhere</span><span class="hint mouse"><span class="kbd">SPACE</span> or mouse, hold it down</span></p>
      <button class="btn" id="go">LET'S FLY</button>
      <p class="tiny"><b>EFOIL FUERTE</b> · La Pared, Fuerteventura · a silly little game</p>
    </div>
  </div>
  <div class="overlay" id="over" hidden>
    <div class="bubble">
      <h2 id="reason">SPLASH!</h2>
      <p>You flew</p>
      <div class="big"><span id="score">0</span> m</div>
      <p id="best"></p>
      <button class="btn" id="again">AGAIN!</button>
      <p class="tiny">Real sessions from €89 · efoil-fuerte.com</p>
    </div>
  </div>
</div>

<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
const startEl=document.getElementById('start'),overEl=document.getElementById('over');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),reasonEl=document.getElementById('reason');
let best=0; try{best=+localStorage.getItem('efoil-best')||0}catch(e){}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- layout: logical world size adapts to orientation, then scales to the stage ----
let W=900,H=500,SEA=330,RX=200,SCALE=1,PORTRAIT=false;
function layout(){
  const r=stage.getBoundingClientRect();
  const cssW=Math.max(1,r.width),cssH=Math.max(1,r.height);
  PORTRAIT=cssH>cssW;
  W=PORTRAIT?520:900;
  H=Math.round(W*cssH/cssW);
  SEA=Math.round(H*(PORTRAIT?0.68:0.66));
  RX=PORTRAIT?150:200;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  SCALE=cssW*dpr/W;
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  if(S){S.x=RX;S.y=Math.min(S.y,SEA-2)}
}
let running=false;
addEventListener('resize',()=>{layout();if(!running||S.over)draw()});
addEventListener('orientationchange',()=>setTimeout(layout,200));

let S=null;
function reset(){S={t:0,dist:0,speed:4.2,x:RX,y:SEA-70,vy:0,hold:false,batt:100,items:[],spray:[],pops:[],bank:0,over:false,shake:0,nextSpawn:90}}
function rnd(a,b){return a+Math.random()*(b-a)}

// ---- comic drawing helpers ----
function outline(fn,fill,lw){ctx.save();ctx.lineWidth=lw||5;ctx.strokeStyle='#1A1A1A';ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();fn();ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.stroke();ctx.restore()}
function halftone(x,y,w,h,col,step){ctx.save();ctx.fillStyle=col;for(let i=x;i<x+w;i+=step)for(let j=y;j<y+h;j+=step){ctx.beginPath();ctx.arc(i+((j/step)%2)*step/2,j,1.6,0,7);ctx.fill()}ctx.restore()}
function cloud(x,y,s){const parts=[[x,y,22*s],[x+26*s,y-10*s,26*s],[x+56*s,y,22*s]];ctx.save();
  ctx.fillStyle='#1A1A1A';for(const [cx,cy,r] of parts){ctx.beginPath();ctx.arc(cx,cy,r+5,0,7);ctx.fill()}ctx.fillRect(x-11*s,y,78*s,25*s);
  ctx.fillStyle='#FFFFFF';for(const [cx,cy,r] of parts){ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill()}ctx.fillRect(x-6*s,y,68*s,20*s);ctx.restore()}
function waveY(x){return SEA+Math.sin((x+S.dist*3)*0.03)*7+Math.sin((x-S.dist*2)*0.011)*5}

function drawSky(){
  ctx.fillStyle='#7FD3F0';ctx.fillRect(0,0,W,SEA);
  const sx=W-100,sy=PORTRAIT?110:80;
  outline(()=>ctx.arc(sx,sy,44,0,7),'#F4C15D',5);
  ctx.save();ctx.strokeStyle='#1A1A1A';ctx.lineWidth=4;for(let i=0;i<8;i++){const a=i*Math.PI/4+S.t*0.004;ctx.beginPath();ctx.moveTo(sx+Math.cos(a)*56,sy+Math.sin(a)*56);ctx.lineTo(sx+Math.cos(a)*72,sy+Math.sin(a)*72);ctx.stroke()}ctx.restore();
  const n=PORTRAIT?3:4,span=W+240;
  for(let i=0;i<n;i++){const cx=((i*(span/n)-S.dist*0.25)%span+span)%span-120,cy=(PORTRAIT?40:50)+i*30;cloud(cx,cy,1+i*0.12)}
  // island silhouette, tiled every 2W
  const per=W*2;ctx.save();ctx.translate(-(S.dist*0.5)%per,0);
  for(let k=0;k<2;k++){const o=k*per;outline(()=>{ctx.moveTo(o-50,SEA);ctx.quadraticCurveTo(o+per*0.1,SEA-120,o+per*0.23,SEA-30);ctx.quadraticCurveTo(o+per*0.34,SEA-170,o+per*0.5,SEA-40);ctx.quadraticCurveTo(o+per*0.62,SEA-100,o+per*0.75,SEA-20);ctx.quadraticCurveTo(o+per*0.88,SEA-130,o+per+60,SEA)},'#C9A46A',5)}
  ctx.restore();
}
function drawSea(){
  ctx.fillStyle='#1F8A8F';ctx.fillRect(0,SEA,W,H-SEA);
  halftone(0,SEA+40,W,H-SEA-40,'rgba(14,58,66,.35)',16);
  ctx.save();ctx.lineWidth=6;ctx.strokeStyle='#1A1A1A';ctx.beginPath();
  for(let x=-20;x<=W+20;x+=10){const y=waveY(x);x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#BFE3E0';ctx.beginPath();
  for(let x=-20;x<=W+20;x+=10){const y=SEA+14+Math.sin((x+S.dist*3)*0.03+1)*6;x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.restore();
}
function drawRider(x,y,tilt){
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
  outline(()=>{ctx.moveTo(-4,10);ctx.lineTo(-4,58);ctx.lineTo(4,58);ctx.lineTo(4,10)},'#1A1A1A',4);
  outline(()=>{ctx.moveTo(-46,60);ctx.quadraticCurveTo(0,48,46,60);ctx.quadraticCurveTo(0,70,-46,60)},'#F26B4E',4);
  outline(()=>{ctx.moveTo(-56,6);ctx.quadraticCurveTo(-60,-6,-40,-8);ctx.lineTo(50,-8);ctx.quadraticCurveTo(66,-6,58,6);ctx.lineTo(-56,6)},'#FFF8E7',5);
  outline(()=>{ctx.moveTo(-14,-8);ctx.lineTo(-10,-40);ctx.lineTo(0,-40);ctx.lineTo(-2,-8)},'#0E3A42',4);
  outline(()=>{ctx.moveTo(14,-8);ctx.lineTo(16,-40);ctx.lineTo(26,-40);ctx.lineTo(28,-8)},'#0E3A42',4);
  outline(()=>{ctx.moveTo(-8,-40);ctx.lineTo(28,-40);ctx.lineTo(30,-78);ctx.lineTo(-10,-78)},'#F26B4E',4);
  outline(()=>{ctx.moveTo(-10,-74);ctx.lineTo(-40,-60);ctx.lineTo(-38,-52);ctx.lineTo(-6,-64)},'#E8B27A',4);
  outline(()=>{ctx.moveTo(30,-74);ctx.lineTo(52,-86);ctx.lineTo(56,-78);ctx.lineTo(32,-64)},'#E8B27A',4);
  outline(()=>ctx.rect(50,-92,10,14),'#1A1A1A',3);
  outline(()=>ctx.arc(12,-92,14,0,7),'#E8B27A',4);
  outline(()=>{ctx.arc(12,-96,17,Math.PI,0);ctx.lineTo(29,-90);ctx.lineTo(-5,-90)},'#F4C15D',4);
  ctx.save();ctx.strokeStyle='#1A1A1A';ctx.lineWidth=3;ctx.beginPath();ctx.arc(14,-88,6,0.2,Math.PI-0.2);ctx.stroke();ctx.fillStyle='#1A1A1A';ctx.beginPath();ctx.arc(18,-94,2,0,7);ctx.fill();ctx.restore();
  ctx.restore();
}
function drawBuoy(o){
  ctx.save();ctx.translate(o.x,waveY(o.x)+6);ctx.rotate(Math.sin(S.t*0.05+o.x)*0.12);
  outline(()=>{ctx.moveTo(-22,0);ctx.lineTo(-16,-40);ctx.lineTo(16,-40);ctx.lineTo(22,0)},'#F26B4E',5);
  outline(()=>ctx.rect(-18,-30,36,10),'#FFF8E7',3);
  outline(()=>{ctx.moveTo(-4,-40);ctx.lineTo(-4,-60);ctx.lineTo(4,-60);ctx.lineTo(4,-40)},'#1A1A1A',3);
  outline(()=>ctx.arc(0,-64,6,0,7),'#F4C15D',3);
  ctx.restore();
}
function drawGull(o){
  ctx.save();ctx.translate(o.x,o.y);const f=Math.sin(S.t*0.25+o.x)*10;
  outline(()=>{ctx.ellipse(0,0,20,10,0,0,7)},'#FFFFFF',4);
  outline(()=>{ctx.moveTo(-6,-2);ctx.quadraticCurveTo(-30,-16+f,-46,-4+f);ctx.quadraticCurveTo(-28,-4,-6,6)},'#FFFFFF',4);
  outline(()=>{ctx.moveTo(6,-2);ctx.quadraticCurveTo(30,-16+f,46,-4+f);ctx.quadraticCurveTo(28,-4,6,6)},'#FFFFFF',4);
  outline(()=>ctx.arc(16,-8,8,0,7),'#FFFFFF',4);
  outline(()=>{ctx.moveTo(23,-8);ctx.lineTo(34,-5);ctx.lineTo(23,-3)},'#F4C15D',3);
  ctx.fillStyle='#1A1A1A';ctx.beginPath();ctx.arc(18,-10,2,0,7);ctx.fill();
  ctx.restore();
}
function drawBattery(o){
  ctx.save();ctx.translate(o.x,o.y+Math.sin(S.t*0.1+o.x)*6);ctx.rotate(-0.2);
  outline(()=>ctx.rect(-16,-26,32,52),'#7BDCB5',5);
  outline(()=>ctx.rect(-7,-32,14,8),'#1A1A1A',3);
  outline(()=>{ctx.moveTo(4,-18);ctx.lineTo(-8,4);ctx.lineTo(1,4);ctx.lineTo(-4,20);ctx.lineTo(9,-4);ctx.lineTo(0,-4)},'#F4C15D',3);
  ctx.restore();
}
function pop(x,y,text,col){S.pops.push({x,y,text,col,t:0})}
function drawPops(){
  for(const p of S.pops){const k=p.t/40;ctx.save();ctx.translate(p.x,p.y-k*40);ctx.rotate(-0.12);ctx.scale(1+k*0.4,1+k*0.4);ctx.globalAlpha=1-k;
    outline(()=>{for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r=i%2?26:40;ctx.lineTo(Math.cos(a)*r*1.6,Math.sin(a)*r)}},p.col,4);
    ctx.fillStyle='#1A1A1A';ctx.font='bold 26px Bangers,Impact,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.text,0,2);ctx.restore()}
}
function drawHUD(){
  ctx.save();ctx.translate(16,16);ctx.rotate(-0.02);
  outline(()=>ctx.rect(0,0,140,46),'#FFF8E7',4);
  ctx.fillStyle='#1A1A1A';ctx.font='30px Bangers,Impact,sans-serif';ctx.textBaseline='middle';ctx.fillText(Math.floor(S.dist/10)+' m',12,24);ctx.restore();
  ctx.save();ctx.translate(172,16);
  outline(()=>ctx.rect(0,0,140,46),'#FFF8E7',4);
  outline(()=>ctx.rect(140,14,8,18),'#1A1A1A',3);
  const w=Math.max(0,128*S.batt/100);const col=S.batt>45?'#7BDCB5':S.batt>20?'#F4C15D':'#F26B4E';
  ctx.fillStyle=col;ctx.fillRect(6,6,w,34);
  if(S.batt<20&&Math.floor(S.t/12)%2===0){ctx.fillStyle='#1A1A1A';ctx.font='22px Bangers,Impact,sans-serif';ctx.textBaseline='middle';ctx.fillText('LOW!',48,24)}
  ctx.restore();
  if(best>0){ctx.save();ctx.fillStyle='#1A1A1A';ctx.font='18px Bangers,Impact,sans-serif';ctx.textAlign='right';ctx.fillText('BEST '+best+' m',W-16,H-16);ctx.restore()}
}

// ---- update ----
function spawn(){
  const r=Math.random();
  if(r<0.42)S.items.push({k:'buoy',x:W+60});
  else if(r<0.72)S.items.push({k:'gull',x:W+60,y:rnd(80,Math.max(120,SEA-190))});
  else S.items.push({k:'batt',x:W+60,y:rnd(110,SEA-60)});
}
function update(k){
  S.t+=k;S.speed=(PORTRAIT?3.6:4.2)+Math.min(4,S.dist/2500);S.dist+=S.speed*k;
  const lift=S.hold?-0.42:0.36;S.vy=Math.max(-5.5,Math.min(5.5,S.vy+lift*k));S.y+=S.vy*k;
  const minY=175,maxY=SEA-2;
  if(S.y<minY){S.y=minY;S.vy=0}
  if(S.y>maxY){S.y=maxY;S.vy=0}
  S.batt-=(S.hold?0.09:0.05)*k;
  if(S.batt<=0){S.batt=0;gameOver('FLAT BATTERY!')}
  const wy=waveY(S.x);
  if(S.y>wy-30&&Math.floor(S.t)%2===0)S.spray.push({x:S.x-40,y:wy,vx:-rnd(2,5),vy:-rnd(2,6),t:0});
  for(const p of S.spray){p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=0.3*k;p.t+=k}
  S.spray=S.spray.filter(p=>p.t<26);
  for(const p of S.pops)p.t+=k;S.pops=S.pops.filter(p=>p.t<40);
  S.nextSpawn-=k;if(S.nextSpawn<=0){spawn();S.nextSpawn=Math.max(38,80-S.dist/200)+rnd(0,40)}
  for(const o of S.items)o.x-=S.speed*(o.k==='gull'?1.35:1)*k;
  S.items=S.items.filter(o=>o.x>-80);
  for(const o of S.items){
    if(o.hit)continue;
    if(o.k==='buoy'){if(Math.abs(o.x-S.x)<40&&S.y+62>wy-58){o.hit=true;gameOver('SPLASH!')}}
    else if(o.k==='gull'){if(Math.abs(o.x-S.x)<44&&o.y>S.y-100&&o.y<S.y+8){o.hit=true;gameOver('SQUAWK!')}}
    else if(o.k==='batt'){if(Math.abs(o.x-S.x)<46&&o.y>S.y-110&&o.y<S.y+70){o.hit=true;S.batt=Math.min(100,S.batt+35);S.bank++;pop(o.x,o.y,'ZAP!','#7BDCB5')}}
  }
  S.items=S.items.filter(o=>!(o.hit&&o.k==='batt'));
  if(S.shake>0)S.shake-=k;
}
let overlayAt=0;
function gameOver(reason){
  if(S.over)return;S.over=true;S.shake=18;S.hold=false;
  const m=Math.floor(S.dist/10);
  pop(S.x,S.y-60,reason,'#F26B4E');
  if(m>best){best=m;try{localStorage.setItem('efoil-best',String(best))}catch(e){}}
  setTimeout(()=>{scoreEl.textContent=m;reasonEl.textContent=reason;bestEl.textContent=(m>=best&&m>0?'New record! ':'Best: '+best+' m · ')+S.bank+' batteries grabbed';overEl.hidden=false;overlayAt=performance.now()},700);
}
function draw(){
  ctx.save();
  if(S.shake>0&&!reduce)ctx.translate(rnd(-6,6),rnd(-6,6));
  drawSky();
  for(const o of S.items)if(o.k==='gull')drawGull(o);
  for(const o of S.items)if(o.k==='batt')drawBattery(o);
  drawSea();
  for(const o of S.items)if(o.k==='buoy')drawBuoy(o);
  for(const p of S.spray){outline(()=>ctx.arc(p.x,p.y,Math.max(1,4-p.t*0.1),0,7),'#FFFFFF',2)}
  if(S.hold){ctx.save();ctx.strokeStyle='#1A1A1A';ctx.lineWidth=3;for(let i=0;i<4;i++){const y=S.y-70+i*22;ctx.beginPath();ctx.moveTo(S.x-90-i*10,y);ctx.lineTo(S.x-130-i*14,y);ctx.stroke()}ctx.restore()}
  drawRider(S.x,S.y,S.vy*0.05);
  drawPops();drawHUD();
  ctx.restore();
}
let raf=0,last=0;function loop(now){const k=last?Math.min(3,(now-last)/16.667):1;last=now;if(!S.over)update(k);else{for(const p of S.pops)p.t+=k;S.pops=S.pops.filter(p=>p.t<40);if(S.shake>0)S.shake-=k}draw();raf=requestAnimationFrame(loop)}

// ---- input: hold anywhere. Tapping an overlay starts / restarts. ----
function overlayOpen(){return !startEl.hidden||!overEl.hidden}
function start(holdNow){
  layout();reset();startEl.hidden=true;overEl.hidden=true;overlayAt=0;running=true;
  cancelAnimationFrame(raf);S.hold=!!holdNow;last=0;raf=requestAnimationFrame(loop);
}
function down(e){
  if(e&&e.target&&e.target.closest&&e.target.closest('.btn'))return;
  if(!running||S.over){
    if(!startEl.hidden){start(true);return}
    if(!overEl.hidden){if(performance.now()-overlayAt<500)return;start(true)}
    return;
  }
  S.hold=true;
}
function up(){if(S)S.hold=false}
stage.addEventListener('pointerdown',e=>{down(e);if(e.pointerType!=='mouse')e.preventDefault()});
addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('blur',up);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(e.repeat)return;down(null)}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')up()});
document.getElementById('go').addEventListener('click',()=>start(false));
document.getElementById('again').addEventListener('click',()=>start(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden)up()});

layout();reset();draw();
// demo mode for testing: ?autostart pulses the throttle
if(location.search.includes('autostart')){setTimeout(()=>{start(true);let on=true;setInterval(()=>{if(S&&!S.over){on=!on;S.hold=on}},650)},300)}
})();
</script>
</body>
</html>
